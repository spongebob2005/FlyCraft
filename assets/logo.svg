<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>FlyCraft logo</title>
  <!-- Badge -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#15282f"/>

  <!-- Flight trail: rises out of the block, loops (barrel roll), ends at the plane -->
  <path d="M140 330 C156 286 110 238 166 222 C222 206 236 282 192 290 C150 298 170 214 252 206"
        fill="none" stroke="#e0a458" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 20"/>

  <!-- The block: isometric cube (top / left / right faces) -->
  <g stroke="#15282f" stroke-width="3" stroke-linejoin="round">
    <polygon points="140,338 192,366 140,394 88,366"   fill="#f3eee4"/>
    <polygon points="88,366 140,394 140,452 88,424"    fill="#cfc6b6"/>
    <polygon points="192,366 140,394 140,452 192,424"  fill="#a99f8d"/>
  </g>

  <!-- Paper plane folded from the same three tones -->
  <g stroke="#15282f" stroke-width="3" stroke-linejoin="round">
    <polygon points="430,104 306,246 360,232"  fill="#a99f8d"/>
    <polygon points="430,104 306,246 324,316"  fill="#cfc6b6"/>
    <polygon points="430,104 236,196 306,246"  fill="#f3eee4"/>
  </g>
  <!-- Centre fold line -->
  <line x1="430" y1="104" x2="306" y2="246" stroke="#15282f" stroke-width="3" stroke-linecap="round"/>
</svg>
