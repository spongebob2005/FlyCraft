<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>FlyCraft logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1230"/>
      <stop offset="1" stop-color="#2b1663"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.45" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Exhaust flame -->
  <path d="M232 326 L280 326 L268 452 L256 470 L244 452 Z" fill="url(#flame)"/>
  <path d="M246 326 L266 326 L260 404 L256 414 L252 404 Z" fill="#fff7cc" opacity="0.85"/>

  <!-- Right wing: two-row pixel staircase sweeping down and out -->
  <g fill="url(#wing)">
    <rect x="286" y="196" width="34" height="34" rx="4"/>
    <rect x="286" y="234" width="34" height="34" rx="4"/>
    <rect x="324" y="234" width="34" height="34" rx="4"/>
    <rect x="324" y="272" width="34" height="34" rx="4"/>
    <rect x="362" y="272" width="34" height="34" rx="4"/>
    <rect x="362" y="310" width="34" height="34" rx="4"/>
    <rect x="400" y="310" width="34" height="34" rx="4"/>
    <rect x="400" y="348" width="34" height="34" rx="4"/>
    <rect x="438" y="348" width="34" height="34" rx="4" opacity="0.75"/>
  </g>
  <!-- Left wing (mirror) -->
  <g fill="url(#wing)">
    <rect x="192" y="196" width="34" height="34" rx="4"/>
    <rect x="192" y="234" width="34" height="34" rx="4"/>
    <rect x="154" y="234" width="34" height="34" rx="4"/>
    <rect x="154" y="272" width="34" height="34" rx="4"/>
    <rect x="116" y="272" width="34" height="34" rx="4"/>
    <rect x="116" y="310" width="34" height="34" rx="4"/>
    <rect x="78"  y="310" width="34" height="34" rx="4"/>
    <rect x="78"  y="348" width="34" height="34" rx="4"/>
    <rect x="40"  y="348" width="34" height="34" rx="4" opacity="0.75"/>
  </g>
  <!-- Block highlights for a crafted, pixel feel -->
  <g fill="#ffffff" opacity="0.28">
    <rect x="290" y="200" width="12" height="6" rx="2"/>
    <rect x="328" y="238" width="12" height="6" rx="2"/>
    <rect x="366" y="276" width="12" height="6" rx="2"/>
    <rect x="404" y="314" width="12" height="6" rx="2"/>
    <rect x="196" y="200" width="12" height="6" rx="2"/>
    <rect x="158" y="238" width="12" height="6" rx="2"/>
    <rect x="120" y="276" width="12" height="6" rx="2"/>
    <rect x="82"  y="314" width="12" height="6" rx="2"/>
  </g>

  <!-- Jet body with nose pointing up -->
  <path d="M256 92 C276 132 282 170 282 214 L282 330 L230 330 L230 214 C230 170 236 132 256 92 Z" fill="url(#body)"/>
  <!-- Cockpit -->
  <path d="M256 140 C266 160 269 178 269 198 L243 198 C243 178 246 160 256 140 Z" fill="#1e1b4b"/>
  <path d="M252 158 C250 170 249 180 249 190 L254 190 C254 180 254 170 252 158 Z" fill="#67e8f9" opacity="0.8"/>

  <!-- Particles -->
  <g fill="#a5f3fc">
    <rect x="96"  y="120" width="14" height="14" rx="2" opacity="0.9"/>
    <rect x="124" y="92"  width="9"  height="9"  rx="2" opacity="0.6"/>
    <rect x="396" y="132" width="14" height="14" rx="2" opacity="0.9"/>
    <rect x="378" y="100" width="9"  height="9"  rx="2" opacity="0.6"/>
  </g>
</svg>
