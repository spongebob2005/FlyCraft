<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>FlyCraft logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1638"/>
      <stop offset="1" stop-color="#5b2033"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="110" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.55" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#f0455a"/>
    </linearGradient>
  </defs>

  <!-- Badge: flat dusk background, matching the cover banner -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <g fill="#7a2c3e" opacity="0.45">
    <rect x="52"  y="60"  width="64" height="28"/>
    <rect x="84"  y="88"  width="40" height="20"/>
    <rect x="392" y="402" width="72" height="30"/>
    <rect x="360" y="432" width="48" height="22"/>
  </g>

